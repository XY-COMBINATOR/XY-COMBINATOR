<!doctype html>
<html lang="en">
  <head>
    <!-- Basic Metadata & Character Encoding -->
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

    <!-- Security & Privacy Policies -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="format-detection" content="telephone=no, address=no, email=no" />

    <!-- Primary SEO Meta Tags -->
    <title>XY Combinator — Design &amp; Engineering Studio for Founders</title>
    <meta name="description" content="XY Combinator is a design &amp; engineering studio for founders who move fast. Websites, mobile apps, and scalable digital products delivered in weeks." />

    <meta name="author" content="XY Combinator" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://xycombinator.com/" />

    <!-- Open Graph / Facebook Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://xycombinator.com/" />
    <meta property="og:site_name" content="XY Combinator" />
    <meta property="og:title" content="XY Combinator — Design &amp; Engineering Studio for Founders" />
    <meta property="og:description" content="XY Combinator is a design &amp; engineering studio for founders who move fast. Websites, mobile apps, and scalable digital products delivered in weeks." />
    <meta property="og:image" content="https://xycombinator.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="XY Combinator — Design &amp; Engineering Studio" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@xycombinators" />
    <meta name="twitter:creator" content="@xycombinators" />
    <meta name="twitter:title" content="XY Combinator — Design &amp; Engineering Studio for Founders" />
    <meta name="twitter:description" content="Design &amp; engineering that ships every week. We build websites, apps, and e-commerce for high-growth startups." />
    <meta name="twitter:image" content="https://xycombinator.com/og.png" />
    <meta name="twitter:image:alt" content="XY Combinator — Design &amp; Engineering Studio" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "XY Combinator",
      "url": "https://xycombinator.com",
      "logo": "https://xycombinator.com/logo.png",
      "description": "XY Combinator is a design & engineering studio helping founders move fast. We build products, brands, and digital experiences that scale.",
      "sameAs": [
        "https://x.com/xycombinators",
        "https://www.linkedin.com/company/xy-combinator"
      ]
    }
    </script>

    <!-- Favicons & App Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#28282b" />
    <meta name="color-scheme" content="dark light" />
    <meta name="msapplication-TileColor" content="#28282b" />
    <meta name="msapplication-config" content="/browserconfig.xml" />

    <!-- Critical Resource Hints for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
